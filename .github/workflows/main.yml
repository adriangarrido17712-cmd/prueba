name: TwistedOTD Bot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install discord.py requests beautifulsoup4 pytz

      - name: Preparar archivos
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: |
          mkdir -p logs botData
          printf '%s' "$DISCORD_TOKEN" > discord_token.txt
          printf '{"1572761244262334475": 1572761244899737612}' > botData/botData.json

      - name: Iniciar TwistedOTD
        run: python TwistedOTDBot.py discord_token.txt
